# SEPS Desktop — uji, lalu bangun installer Windows (.exe) dan paket pembaruan (.json).
# Hasil: tab Actions › run ini › Artifacts "SEPS-windows".
# Rilis resmi: buat tag "seps-v<versi>" (mis. seps-v1.0.0) → berkas juga dilampirkan ke GitHub Releases.
name: SEPS Desktop

on:
  push:
    paths:
      - 'seps/**'
      - '.github/workflows/seps-desktop.yml'
    tags:
      - 'seps-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Uji backend (engine, API, pembaruan desktop)
        working-directory: seps/backend
        run: |
          npm ci
          npm test
      - name: Uji pemilih versi desktop
        working-directory: seps/desktop
        run: node --test test/*.test.js

  windows:
    needs: uji
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bangun tampilan
        working-directory: seps/frontend
        run: |
          npm ci
          npm run build
      - name: Bangun installer Windows
        working-directory: seps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist:win
      - name: Buat paket pembaruan
        run: node seps/alat/buat-paket.js seps/desktop/dist
      - uses: actions/upload-artifact@v4
        with:
          name: SEPS-windows
          path: |
            seps/desktop/dist/SEPS-Setup-*.exe
            seps/desktop/dist/seps-pembaruan-*.json
          if-no-files-found: error

  rilis:
    if: startsWith(github.ref, 'refs/tags/seps-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SEPS-windows
          path: rilis
      - uses: softprops/action-gh-release@v2
        with:
          files: rilis/*
