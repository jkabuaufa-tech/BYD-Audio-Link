    </div>`;

  /** Deviasi: ikon + tanda + teks (tidak mengandalkan warna saja). */
  function deviasiHTML(v, digits = 2) {
    if (v == null) return '<span class="text-slate-400">–</span>';
    const zero = Math.abs(v) < 5e-7;
    const cls = zero ? 'text-slate-600' : v > 0 ? 'text-emerald-700' : 'text-red-700';
    return `<span class="inline-flex items-center gap-1 ${cls}">${ui.icon(zero ? 'minus' : v > 0 ? 'trending-up' : 'trending-down', 'size-3.5')}${fmt.pct(zero ? 0 : v, digits, !zero)}</span>`;
  }

  function render(ctx) {
    const { view } = ctx, s = view.summary;
    const dev = s.deviasi, zero = Math.abs(dev) < 5e-7;
    const devLabel = zero ? 'Sesuai target' : dev > 0 ? 'Lebih cepat dari target' : 'Tertinggal dari target';
    const perhatian = view.items.filter((i) => i.status === calc.STATUS.LATE || i.status === calc.STATUS.OVER);

    return `
    <section class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="Ringkasan progres">
      ${tile('Realisasi s.d. tanggal', fmt.pct(s.realisasiSd, 3), `${fmt.rp(s.nilaiRealisasiSd)} · posisi ${fmt.tgl(s.tanggalMonitoring)}`, 'activity')}
      ${tile('Target linier s.d. tanggal', fmt.pct(s.targetLinier, 3), `Target Desember 2026: <b>${fmt.pct(s.targetDes)}</b>`, 'target')}
      ${tile('Deviasi target', deviasiHTML(dev, 3), devLabel, '', '')}
      ${tile('Sisa ke target Des', fmt.pct(s.sisaKeTarget, 3), `Realisasi hari ini: <b>${fmt.pct(s.realisasiHariIni, 3)}</b>`, 'calendar-check')}
      ${tile('Nilai Nego BOQ', `<span class="text-lg">${fmt.rp(s.totalNilai)}</span>`, `${s.jumlahItem} item · ${view.divisions.length} divisi`, 'wallet')}
      ${tile('Item terlambat', s.itemTerlambat, s.itemTerlambat ? 'Lewat jadwal selesai, belum 100%' : 'Tidak ada item lewat jadwal', 'clock', s.itemTerlambat ? 'text-orange-700' : '')}
      ${tile('Item CEK &gt; BOQ', s.itemCekBoq, s.itemCekBoq ? 'Volume melebihi BOQ — perlu verifikasi' : 'Tidak ada input melebihi BOQ', 'octagon-alert', s.itemCekBoq ? 'text-red-700' : '')}
      ${tile('Target detail per item', fmt.pct(s.targetDetailDes), `${s.itemTerisiTarget} item bertarget · selisih ke target Des ${fmt.pct(s.selisihTargetDetail, 3, true)}`, 'list-checks')}
    </section>

    <section class="viz-root card mt-4 p-4" style="--series-1:#2a78d6;--series-2:#eb6834">
      <div class="flex flex-wrap items-start justify-between gap-2">
        <div><h2 class="font-semibold text-slate-900">Target vs realisasi kumulatif</h2>
          <p class="text-xs text-slate-500">Berbobot nilai nego · ${fmt.tgl(ctx.state.project.baselineMulai)} – ${fmt.tgl(ctx.state.project.baselineAkhir)} · target harian linier (simulasi)</p></div>
        <div class="flex items-center gap-4 text-xs text-slate-600">
          <span class="inline-flex items-center gap-1.5"><span class="inline-block h-0.5 w-5 rounded" style="background:var(--series-1)"></span>Realisasi kumulatif</span>
          <span class="inline-flex items-center gap-1.5"><span class="inline-block h-0.5 w-5 rounded" style="background:var(--series-2)"></span>Target kumulatif</span>
          <button type="button" data-goto="monitoring" class="no-print font-medium text-blue-700 hover:underline">Lihat tabel harian</button>
        </div>
      </div>
      <div id="chart-kurva" class="relative mt-2"></div>
    </section>

    <section class="card mt-4">
      <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-3">
        <div><h2 class="font-semibold text-slate-900">Rekap divisi · bahan rapat action plan</h2>
          <p class="text-xs text-slate-500">Klik nama divisi untuk melihat rincian item.${ctx.isAdmin ? ' Klik ikon pensil untuk mengisi PIC, kendala, dan keputusan rapat.' : ' Pengisian action plan dilakukan oleh Admin.'}</p></div>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>No</th><th>Divisi Pekerjaan</th><th class="num">Nilai BOQ (Rp)</th><th class="num">Bobot BOQ</th><th class="num">Target Des</th><th class="num">Realisasi</th><th class="num">Deviasi</th>
          <th>PIC</th><th>Kendala Utama</th><th>Tindak Lanjut / Keputusan</th><th>Due Date</th><th>Status Action</th>${ctx.isAdmin ? '<th class="no-print"></th>' : ''}</tr></thead>
        <tbody>${view.divisions.map((d) => `
          <tr>
            <td class="num">${d.no}</td>
            <td class="min-w-56"><button type="button" data-div="${d.id}" class="cursor-pointer text-left font-medium text-blue-800 hover:underline">${esc(d.kode)} – ${esc(d.nama)}</button>
              <div class="text-xs text-slate-500">${d.jumlahItem} item${d.itemTerlambat ? ` · <span class="font-medium text-orange-700">${d.itemTerlambat} terlambat</span>` : ''}</div></td>
            <td class="num">${fmt.rp(d.nilai).slice(3)}</td>
            <td class="num">${fmt.pct(d.bobot)}</td>
            <td class="num">${fmt.pct(d.targetDes)}</td>
            <td class="num min-w-24">${fmt.pct(d.realisasi, 3)}${ui.meter(d.targetDes ? d.realisasi / d.targetDes : 0)}</td>
            <td class="num">${deviasiHTML(d.deviasi)}</td>
            <td class="min-w-24">${esc(d.pic) || '<span class="text-slate-400">–</span>'}</td>
            <td class="min-w-48 whitespace-pre-line">${esc(d.kendala) || '<span class="text-slate-400">–</span>'}</td>
            <td class="min-w-48 whitespace-pre-line">${esc(d.tindakLanjut) || '<span class="text-slate-400">–</span>'}</td>
            <td class="whitespace-nowrap ${d.dueDate && d.dueDate < s.tanggalMonitoring && d.statusAction !== 'CLOSED' ? 'font-medium text-red-700' : ''}">${fmt.tgl(d.dueDate)}</td>
            <td>${ui.statusBadge(d.statusAction)}</td>
            ${ctx.isAdmin ? `<td class="no-print"><button type="button" class="btn-icon" data-edit-div="${d.id}" aria-label="Ubah action plan divisi ${esc(d.kode)}">${ui.icon('pencil')}</button></td>` : ''}
          </tr>`).join('')}</tbody>
        <tfoot><tr><td></td><td>TOTAL SELURUH DIVISI</td><td class="num">${fmt.rp(s.totalNilai).slice(3)}</td><td class="num">100,00%</td>
          <td class="num">${fmt.pct(s.targetDetailDes)}</td><td class="num">${fmt.pct(view.divisions.reduce((a, d) => a + d.realisasi, 0), 3)}</td>
          <td class="num">${deviasiHTML(view.divisions.reduce((a, d) => a + d.realisasi, 0) - s.targetDetailDes)}</td><td colspan="${ctx.isAdmin ? 6 : 5}" class="text-xs font-normal text-slate-500">Deviasi di tabel ini = realisasi − target Des per item (bukan target linier harian).</td></tr></tfoot>
      </table></div>
    </section>

    ${perhatian.length ? `
    <section class="card mt-4">
      <h2 class="px-4 py-3 font-semibold text-slate-900">Item perlu perhatian (${perhatian.length})</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kode</th><th>Uraian</th><th class="num">Vol BOQ</th><th class="num">Realisasi</th><th>Jadwal selesai</th><th>PIC</th><th>Status</th></tr></thead>
      <tbody>${perhatian.slice(0, 15).map((i) => `<tr><td class="font-mono text-xs">${esc(i.id)}</td><td class="min-w-64">${esc(i.uraian)}</td>
        <td class="num">${fmt.vol(i.volume)} ${esc(i.satuan)}</td><td class="num">${fmt.vol(i.realisasi)} (${fmt.pct(i.progres, 1)})</td><td class="whitespace-nowrap">${fmt.tgl(i.selesai)}</td><td>${esc(i.pic) || '–'}</td><td>${ui.statusBadge(i.status)}</td></tr>`).join('')}</tbody></table></div>
      ${perhatian.length > 15 ? `<p class="px-4 py-2 text-xs text-slate-500">Menampilkan 15 dari ${perhatian.length}. Lihat semuanya di tab Input Harian &amp; BOQ dengan filter status.</p>` : ''}
    </section>` : ''}`;
  }

  // ------------------------------------------------------------- grafik SVG
  function drawChart(host, ctx) {
    const rows = ctx.view.daily, mon = ctx.ui.tanggalMonitoring;
    if (!rows.length) { host.innerHTML = ''; return; }
    const W = Math.max(320, host.clientWidth), H = 280, m = { l: 46, r: 112, t: 14, b: 30 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length;
    const real = rows.filter((r) => r.tanggal <= mon);
    const maxV = Math.max(ctx.state.project.targetDes, ...real.map((r) => r.realKum), 0.001);
    const step = [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5].find((st) => maxV / st <= 7) || 1;
    const top = Math.ceil((maxV * 1.0001) / step) * step;
    const x = (i) => m.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw), y = (v) => m.t + ih - (v / top) * ih;
    const path = (list, key) => list.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join('');
    const digits = step < 0.01 ? (step < 0.001 ? 2 : 1) : 0;
    let grid = '';
    for (let v = 0; v <= top + 1e-9; v += step) {
      grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#64748b">${fmt.pct(v, digits)}</text>`;
    }
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
    let xt = '';
    rows.forEach((r, i) => { if (i % every === 0) xt += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#64748b">${fmt.tglPendek(r.tanggal)}</text>`; });
    const last = rows[n - 1], rl = real[real.length - 1];
    const monIdx = rows.findIndex((r) => r.tanggal === mon);
    // Label ujung garis; geser bila kedua label berimpit.
    const ty = y(last.targetKum);
    let ry = rl ? y(rl.realKum) : 0;
    if (rl && real.length > n - 10 && Math.abs(ry - ty) < 24) ry = ty + 30;
    host.innerHTML = `
      <svg width="${W}" height="${H}" role="img" aria-label="Grafik target dan realisasi kumulatif. Realisasi s.d. ${fmt.tgl(mon)}: ${fmt.pct(ctx.view.summary.realisasiSd, 3)}; target linier: ${fmt.pct(ctx.view.summary.targetLinier, 3)}.">
        ${grid}${xt}
        ${monIdx >= 0 ? `<line x1="${x(monIdx)}" x2="${x(monIdx)}" y1="${m.t}" y2="${m.t + ih}" stroke="#94a3b8" stroke-dasharray="3 3"/>
          <text x="${x(monIdx) + (monIdx > n * 0.8 ? -6 : 6)}" y="${m.t + 10}" text-anchor="${monIdx > n * 0.8 ? 'end' : 'start'}" font-size="11" fill="#475569">Tgl monitoring</text>` : ''}
        <path d="${path(rows, 'targetKum')}" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-linejoin="round"/>
        ${real.length ? `<path d="${path(real, 'realKum')}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="${x(real.length - 1)}" cy="${y(rl.realKum)}" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="2"/>` : ''}
        <text x="${W - m.r + 8}" y="${ty - 2}" font-size="11" fill="#475569">Target</text>
        <text x="${W - m.r + 8}" y="${ty + 12}" font-size="12" font-weight="600" fill="#0f172a">${fmt.pct(last.targetKum)}</text>
        ${rl ? `<text x="${x(real.length - 1) + 9}" y="${ry + 4}" font-size="12" fill="#475569" stroke="#fff" stroke-width="3" paint-order="stroke">Realisasi <tspan font-weight="600" fill="#0f172a">${fmt.pct(rl.realKum, 3)}</tspan></text>` : ''}
        <g data-cross style="display:none"><line y1="${m.t}" y2="${m.t + ih}" stroke="#475569"/>
          <circle data-dot="t" r="4" fill="var(--series-2)" stroke="#fff" stroke-width="2"/><circle data-dot="r" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="2"/></g>
        <rect data-hit x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
      </svg>
      <div data-tip class="pointer-events-none absolute z-10 hidden rounded-lg bg-slate-900 px-3 py-2 text-xs text-white shadow-lg"></div>`;

    const cross = host.querySelector('[data-cross]'), tip = host.querySelector('[data-tip]'), hit = host.querySelector('[data-hit]');
    hit.addEventListener('mousemove', (e) => {
      const box = host.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - box.left - m.l) / iw) * (n - 1))));
      const r = rows[i], hasReal = r.tanggal <= mon;
      cross.style.display = '';
      cross.querySelector('line').setAttribute('x1', x(i)); cross.querySelector('line').setAttribute('x2', x(i));
      const dt = cross.querySelector('[data-dot=t]'), dr = cross.querySelector('[data-dot=r]');
      dt.setAttribute('cx', x(i)); dt.setAttribute('cy', y(r.targetKum));
      dr.style.display = hasReal ? '' : 'none';
      dr.setAttribute('cx', x(i)); dr.setAttribute('cy', y(r.realKum));
      tip.innerHTML = `<div class="mb-1 font-semibold">${fmt.tgl(r.tanggal, true)}</div>
        <div class="flex justify-between gap-4"><span>Target kum.</span><span class="tabular-nums">${fmt.pct(r.targetKum, 3)}</span></div>
        ${hasReal ? `<div class="flex justify-between gap-4"><span>Realisasi kum.</span><span class="tabular-nums">${fmt.pct(r.realKum, 3)}</span></div>
        <div class="flex justify-between gap-4"><span>Deviasi</span><span class="tabular-nums">${fmt.pct(r.deviasi, 3, true)}</span></div>` : '<div class="text-slate-300">Belum ada realisasi (setelah tgl monitoring)</div>'}`;
      tip.classList.remove('hidden');
      const tx = x(i) + 12, flip = tx + tip.offsetWidth > W - 4;
      tip.style.left = (flip ? x(i) - 12 - tip.offsetWidth : tx) + 'px';
      tip.style.top = m.t + 8 + 'px';
    });
    hit.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.classList.add('hidden'); });
  }

  function editDivision(ctx, id) {
    const d = ctx.view.divisions.find((x) => x.id === id);
    ui.modal({
      title: `Action plan · ${d.kode} – ${d.nama}`,
      subtitle: `Realisasi ${fmt.pct(d.realisasi, 3)} dari target Des ${fmt.pct(d.targetDes)}`,
      body: `<div class="grid gap-4 sm:grid-cols-3">
        ${ui.field('PIC', `<input name="pic" class="input" maxlength="80" value="${esc(d.pic)}">`)}
        ${ui.field('Due date', `<input name="dueDate" type="date" class="input" value="${d.dueDate || ''}">`)}
        ${ui.field('Status action', `<select name="statusAction" class="input">${ui.options(STATUS_ACTION, d.statusAction)}</select>`)}
        ${ui.field('Kendala utama', `<textarea name="kendala" rows="3" class="input" maxlength="1000">${esc(d.kendala)}</textarea>`, '', 'sm:col-span-3')}
        ${ui.field('Tindak lanjut / keputusan rapat', `<textarea name="tindakLanjut" rows="3" class="input" maxlength="1000">${esc(d.tindakLanjut)}</textarea>`, '', 'sm:col-span-3')}</div>`,
      onSubmit(v) {
        store.updateDivision(id, { pic: v.pic.trim(), kendala: v.kendala.trim(), tindakLanjut: v.tindakLanjut.trim(), dueDate: v.dueDate || null, statusAction: v.statusAction });
        ui.toast('Action plan divisi disimpan');
      },
    });
  }

  JIAT.registerModule({
    id: 'dashboard', label: 'Dashboard & Rekap Action Plan', icon: 'layout-dashboard', order: 10, render,
    mount(el, ctx) {
      const host = el.querySelector('#chart-kurva');
      drawChart(host, ctx);
      window.onresize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (host.isConnected) drawChart(host, ctx); }, 150); };
      el.querySelectorAll('[data-div]').forEach((b) => b.addEventListener('click', () => ctx.navigate('input', { divisionId: b.dataset.div, mode: 'master' })));
      el.querySelectorAll('[data-edit-div]').forEach((b) => b.addEventListener('click', () => editDivision(ctx, b.dataset.editDiv)));
      el.querySelector('[data-goto]').addEventListener('click', () => ctx.navigate('monitoring'));
    },
  });
})();
</script>
  <script>/** Modul B — Input Harian (Staf) & Rincian/Master BOQ (Admin). */
(function () {
  'use strict';
  const { fmt, ui, store, calc } = JIAT;
  const { esc } = fmt;

  // State lokal modul (bertahan selama sesi; tidak ikut tersimpan).
  const local = { mode: 'input', q: '', divisionId: '', status: '', tanggal: null, hanyaTerisi: false, draft: new Map() };
  let ctx = null, root = null;

  const clampTanggal = (t, p) => (t < p.baselineMulai ? p.baselineMulai : t > p.baselineAkhir ? p.baselineAkhir : t);
  const divLabel = (d) => `${d.kode} – ${d.nama}`;
  const dash = '<span class="text-slate-400">–</span>';

  function filtered() {
    const q = local.q.trim().toLowerCase();
    return ctx.view.items.filter((i) =>
      (!local.divisionId || i.divisionId === local.divisionId) &&
      (!local.status || (local.status === 'CEK > BOQ' ? i.realisasiTotal > i.volume + calc.EPS : i.status === local.status)) &&
      (!q || (i.id + ' ' + i.uraian + ' ' + i.subbagian + ' ' + i.pic).toLowerCase().includes(q)));
  }
  /** Volume tersimpan per item pada tanggal input. */
  const tersimpan = () => new Map(ctx.state.progress.filter((p) => p.tanggal === local.tanggal).map((p) => [p.itemId, p.volume]));

  /** Hitung satu baris input dari draft (atau nilai tersimpan). */
  function hitungBaris(item, saved) {
    const ada = saved.get(item.id) || 0;
    const raw = local.draft.has(item.id) ? local.draft.get(item.id) : null;
    const parsed = raw == null ? ada : fmt.parseNum(raw);
    const invalid = raw != null && (Number.isNaN(parsed) || parsed < 0);
    const volume = invalid ? ada : parsed || 0;
    const cek = calc.cekInputHarian(item, item.realisasiTotal - ada, volume);
    return { ada, volume, invalid, berubah: raw != null && !invalid && Math.abs(volume - ada) > calc.EPS, lain: item.realisasiTotal - ada, ...cek };
  }

  // ------------------------------------------------------------------ render
  function render(c) {
    ctx = c;
    if (c.params) {
      if (c.params.divisionId) { local.divisionId = c.params.divisionId; local.q = ''; local.status = ''; }
      if (c.params.mode) local.mode = c.params.mode;
    }
    if (!local.tanggal) local.tanggal = clampTanggal(c.ui.tanggalMonitoring, c.state.project);
    local.tanggal = clampTanggal(local.tanggal, c.state.project);
    const seg = (id, label, ic) => `<button type="button" data-mode="${id}" aria-pressed="${local.mode === id}">${ui.icon(ic)}${label}</button>`;
    return `
    <div class="card">
      <div class="no-print flex flex-wrap items-end gap-3 border-b border-slate-200 px-4 py-3">
        <div><span class="label">Tampilan</span><div class="seg">${seg('input', 'Input Harian', 'pencil')}${seg('master', 'Rincian BOQ', 'clipboard-list')}</div></div>
        ${local.mode === 'input' ? `<label class="block"><span class="label">Tanggal input</span>
          <input id="f-tanggal" type="date" class="input w-40" value="${local.tanggal}" min="${c.state.project.baselineMulai}" max="${c.state.project.baselineAkhir}"></label>` : ''}
        <label class="block min-w-48 flex-1"><span class="label">Cari</span>
          <span class="relative block"><span class="pointer-events-none absolute inset-y-0 left-2.5 flex items-center text-slate-400">${ui.icon('search')}</span>
          <input id="f-q" type="search" class="input pl-8" placeholder="Kode, uraian, subbagian, PIC…" value="${esc(local.q)}"></span></label>
        <label class="block"><span class="label">Divisi</span><select id="f-div" class="input w-56">${ui.options([['', 'Semua divisi'], ...c.state.divisions.map((d) => [d.id, divLabel(d)])], local.divisionId)}</select></label>
        <label class="block"><span class="label">Status</span><select id="f-status" class="input w-40">${ui.options([['', 'Semua status'], ...Object.values(calc.STATUS)], local.status)}</select></label>
        ${local.mode === 'input' ? `<label class="flex items-center gap-2 pb-1.5 text-sm text-slate-700"><input id="f-terisi" type="checkbox" class="size-4 accent-blue-700" ${local.hanyaTerisi ? 'checked' : ''}>Hanya yang terisi</label>` : ''}
        ${local.mode === 'master' && c.isAdmin ? `<button type="button" id="btn-tambah" class="btn-primary ml-auto">${ui.icon('plus')}Tambah item</button>` : ''}
      </div>
      <div id="tbl-host"></div>
    </div>
    ${local.mode === 'input' ? `<p class="mt-2 text-xs text-slate-500">Isi volume realisasi untuk <b>${fmt.tgl(local.tanggal, true)}</b> sesuai satuan BOQ. Desimal boleh memakai koma atau titik (contoh 12,5); jangan memakai pemisah ribuan. Kosongkan atau isi 0 untuk menghapus entri. Total melebihi volume BOQ ditandai <b>CEK &gt; BOQ</b>.</p>` : ''}
    <div id="save-bar"></div>`;
  }

  function tableHTML() {
    const rows = local.mode === 'input' ? inputRows() : filtered();
    if (!rows.length) return `<div class="px-4 py-12 text-center text-sm text-slate-500">Tidak ada item yang cocok dengan filter. <button type="button" id="btn-clear" class="font-medium text-blue-700 hover:underline">Hapus filter</button></div>`;
    return local.mode === 'input' ? inputTable(rows) : masterTable(rows);
  }
  function inputRows() {
    const saved = tersimpan();
    return filtered().filter((i) => !local.hanyaTerisi || saved.has(i.id) || local.draft.has(i.id));
  }
  /** Sisipkan baris judul divisi di antara baris item. */
  function grouped(rows, cols, rowHTML) {
    let last = null, html = '';
    for (const r of rows) {
      if (r.divisionId !== last) {
        last = r.divisionId;
        const d = ctx.view.divisions.find((x) => x.id === last);
        html += `<tr class="group-row"><td colspan="${cols}">${esc(divLabel(d))} <span class="font-normal normal-case text-slate-500">· bobot ${fmt.pct(d.bobot)} · realisasi ${fmt.pct(d.realisasi, 3)}</span></td></tr>`;
      }
      html += rowHTML(r);
    }
    return html;
  }

  function inputTable(rows) {
    const saved = tersimpan();
    return `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Kode</th><th>Uraian BOQ</th><th>Sat</th><th class="num">Vol BOQ</th><th class="num">Kumulatif<br>tgl lain</th>
        <th class="num">Volume<br>${fmt.tglPendek(local.tanggal)}</th><th class="num">Kumulatif</th><th class="num">Sisa Vol</th><th class="num">Progres</th><th class="num">Bobot<br>tercapai</th><th>Keterangan</th></tr></thead>
      <tbody>${grouped(rows, 11, (i) => {
        const b = hitungBaris(i, saved);
        const val = local.draft.has(i.id) ? local.draft.get(i.id) : b.ada ? String(b.ada).replace('.', ',') : '';
        return `<tr data-row="${esc(i.id)}">
          <td class="font-mono text-xs">${esc(i.id)}</td>
          <td class="min-w-64">${esc(i.uraian)}${i.subbagian ? `<div class="text-xs text-slate-500">${esc(i.subbagian)}</div>` : ''}</td>
          <td>${esc(i.satuan)}</td><td class="num">${fmt.vol(i.volume)}</td><td class="num">${fmt.vol(b.lain)}</td>
          <td class="num"><input data-input="${esc(i.id)}" inputmode="decimal" autocomplete="off" aria-label="Volume ${esc(i.id)} tanggal ${local.tanggal}"
            class="input ml-auto w-28 text-right tabular-nums" value="${esc(val)}" placeholder="0"></td>
          ${computedCells(i, b)}</tr>`;
      })}</tbody></table></div>`;
  }
  function computedCells(i, b) {
    const ket = b.invalid ? ui.badge('Angka tidak valid', 'bad', 'octagon-alert')
      : b.melebihiBoq ? ui.badge('CEK > BOQ', 'bad', 'octagon-alert') + `<div class="mt-1 text-xs text-red-700">Lebih ${fmt.vol(b.kelebihan)} ${esc(i.satuan)} dari BOQ</div>`
      : b.berubah ? ui.badge('Belum disimpan', 'warn', 'pencil') : b.ada ? ui.badge('Tersimpan', 'good', 'circle-check') : '';
    const progres = i.volume ? b.total / i.volume : 0;
    return `<td class="num" data-c>${fmt.vol(b.total)}</td><td class="num" data-c>${fmt.vol(b.sisa)}</td>
      <td class="num min-w-20" data-c>${fmt.pct(progres, 1)}${ui.meter(progres, b.melebihiBoq ? 'bg-red-600' : 'bg-blue-600')}</td>
      <td class="num" data-c>${fmt.pct(i.bobot * progres, 3)}</td><td data-c class="min-w-36">${ket}</td>`;
  }

  function masterTable(rows) {
    const sum = (f) => rows.reduce((s, r) => s + (f(r) || 0), 0);
    return `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Kode</th><th>Uraian BOQ</th><th>Sat</th><th class="num">Vol BOQ</th><th class="num">Harga Nego (Rp)</th><th class="num">Nilai BOQ (Rp)</th><th class="num">Bobot BOQ</th>
        <th class="num">Target Vol Des</th><th class="num">Target Bobot Des</th><th>PIC</th><th>Jadwal</th><th class="num">Realisasi s.d. tgl</th><th class="num">Sisa Vol</th><th class="num">Progres</th><th class="num">Kontribusi</th><th>Status</th><th class="no-print"></th></tr></thead>
      <tbody>${grouped(rows, 17, (i) => `<tr>
        <td class="font-mono text-xs">${esc(i.id)}</td>
        <td class="min-w-64">${esc(i.uraian)}${i.subbagian ? `<div class="text-xs text-slate-500">${esc(i.subbagian)}</div>` : ''}
          ${i.kendala ? `<div class="mt-1 text-xs text-orange-800"><b>Kendala:</b> ${esc(i.kendala)}</div>` : ''}${i.actionPlan ? `<div class="text-xs text-slate-600"><b>Tindak lanjut:</b> ${esc(i.actionPlan)}${i.dueDate ? ' · due ' + fmt.tgl(i.dueDate) : ''}</div>` : ''}</td>
        <td>${esc(i.satuan)}</td><td class="num">${fmt.vol(i.volume)}</td><td class="num">${fmt.rp0(i.hargaNego)}</td><td class="num">${fmt.rp0(i.nilai)}</td><td class="num">${fmt.pct(i.bobot, 3)}</td>
        <td class="num">${i.targetVolDes == null ? dash : fmt.vol(i.targetVolDes)}</td><td class="num">${i.targetBobotDes == null ? dash : fmt.pct(i.targetBobotDes, 3)}</td>
        <td>${esc(i.pic) || dash}</td>
        <td class="whitespace-nowrap text-xs">${i.mulai || i.selesai ? `${i.mulai ? fmt.tglPendek(i.mulai) : '?'} – ${i.selesai ? fmt.tglPendek(i.selesai) : '?'}` : dash}</td>
        <td class="num">${fmt.vol(i.realisasi)}</td><td class="num">${fmt.vol(i.sisa)}</td>
        <td class="num min-w-20">${fmt.pct(i.progres, 1)}${ui.meter(i.progres, i.status === calc.STATUS.OVER ? 'bg-red-600' : 'bg-blue-600')}</td>
        <td class="num">${fmt.pct(i.kontribusi, 3)}</td><td>${ui.statusBadge(i.status)}</td>
        <td class="no-print"><button type="button" class="btn-icon" data-item="${esc(i.id)}" aria-label="${ctx.isAdmin ? 'Ubah' : 'Lihat detail'} item ${esc(i.id)}">${ui.icon(ctx.isAdmin ? 'pencil' : 'history')}</button></td></tr>`)}</tbody>
      <tfoot><tr><td colspan="5">TOTAL (${rows.length} item${rows.length < ctx.view.items.length ? ' terfilter' : ''})</td><td class="num">${fmt.rp0(sum((r) => r.nilai))}</td><td class="num">${fmt.pct(sum((r) => r.bobot))}</td>
        <td></td><td class="num">${fmt.pct(sum((r) => r.targetBobotDes))}</td><td colspan="5"></td><td class="num">${fmt.pct(sum((r) => r.kontribusi), 3)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`;
  }

  // ---------------------------------------------------------------- simpan
  function perubahan() {
    const saved = tersimpan(), out = [];
    for (const id of local.draft.keys()) {
      const item = ctx.view.items.find((i) => i.id === id);
      if (!item) continue;
      const b = hitungBaris(item, saved);
      if (b.invalid || b.berubah) out.push({ item, ...b });
    }
    return out;
  }
  function refreshSaveBar() {
    const host = root.querySelector('#save-bar');
    if (!host) return;
    const ch = local.mode === 'input' ? perubahan() : [];
    if (!ch.length) { host.innerHTML = ''; return; }
    const invalid = ch.filter((c) => c.invalid).length, over = ch.filter((c) => !c.invalid && c.melebihiBoq).length;
    const nilai = ch.reduce((s, c) => s + (c.invalid ? 0 : (c.volume - c.ada) * c.item.hargaNego), 0);
    host.innerHTML = `<div class="no-print sticky bottom-3 z-20 mt-3 flex flex-wrap items-center justify-between gap-3 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-xl">
      <div><b>${ch.length} perubahan</b> belum disimpan untuk ${fmt.tgl(local.tanggal)} · selisih nilai progres ${nilai < 0 ? '−' : '+'}${fmt.rp(Math.abs(nilai))} (${fmt.pct(nilai / ctx.view.summary.totalNilai, 3, true)})
        ${over ? `<span class="ml-2 inline-flex items-center gap-1 font-semibold text-amber-300">${ui.icon('triangle-alert')}${over} item CEK &gt; BOQ</span>` : ''}
        ${invalid ? `<span class="ml-2 inline-flex items-center gap-1 font-semibold text-red-300">${ui.icon('octagon-alert')}${invalid} angka tidak valid</span>` : ''}</div>
      <div class="flex gap-2"><button type="button" id="btn-batal" class="btn">Batalkan</button>
      <button type="button" id="btn-simpan" class="btn-primary" ${invalid ? 'disabled title="Perbaiki angka yang tidak valid dulu"' : ''}>${ui.icon('save')}Simpan input harian</button></div></div>`;
    host.querySelector('#btn-batal').addEventListener('click', () => { local.draft.clear(); refreshTable(); });
    host.querySelector('#btn-simpan').addEventListener('click', simpan);
  }
  async function simpan() {
    const ch = perubahan();
    if (!ch.length || ch.some((c) => c.invalid)) return;
    const over = ch.filter((c) => c.melebihiBoq);
    if (over.length) {
      const ok = await ui.confirm({
        title: `CEK > BOQ pada ${over.length} item`, confirmLabel: 'Tetap simpan',
        message: `Total realisasi berikut melebihi volume BOQ:<ul class="mt-2 list-disc space-y-1 pl-5">${over.slice(0, 6).map((c) =>
          `<li><b>${esc(c.item.id)}</b> — ${fmt.vol(c.total)} dari ${fmt.vol(c.item.volume)} ${esc(c.item.satuan)} (lebih ${fmt.vol(c.kelebihan)})</li>`).join('')}${over.length > 6 ? `<li>…dan ${over.length - 6} item lain</li>` : ''}</ul>
          <p class="mt-2">Periksa satuan dan angka. Bila memang pekerjaan tambah, simpan lalu tindak lanjuti lewat addendum.</p>`,
      });
      if (!ok) return;
    }
    const tanggal = local.tanggal, n = ch.length;
    local.draft.clear();
    store.saveProgress(ch.map((c) => ({ itemId: c.item.id, tanggal, volume: c.volume })), ctx.pengguna);
    ui.toast(`${n} input harian ${fmt.tgl(tanggal)} tersimpan`);
  }

  // ------------------------------------------------------------ modal item
  function itemModal(id) {
    const baru = !id, admin = ctx.isAdmin;
    const i = baru ? { id: '', divisionId: local.divisionId || ctx.state.divisions[0].id, subbagian: '', uraian: '', satuan: '', volume: '', hargaNego: '', targetVolDes: null, pic: '', mulai: '', selesai: '', kendala: '', actionPlan: '', dueDate: '' }
      : ctx.view.items.find((x) => x.id === id);
    const ro = admin ? '' : 'disabled';
    const num = (v) => (v == null || v === '' ? '' : String(v).replace('.', ','));
    const riwayat = baru ? [] : ctx.state.progress.filter((p) => p.itemId === id).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
    ui.modal({
      title: baru ? 'Tambah item BOQ' : `${admin ? 'Ubah' : 'Detail'} item ${i.id}`, size: 'max-w-3xl',
      subtitle: baru ? 'Item baru ikut menghitung ulang bobot seluruh BOQ.' : `Nilai ${fmt.rp(i.nilai)} · bobot ${fmt.pct(i.bobot, 3)} · realisasi ${fmt.vol(i.realisasi)} ${i.satuan}`,
      onSubmit: admin ? submit : null,
      extraFooter: admin && !baru ? `<button type="button" data-hapus class="btn text-red-700">${ui.icon('trash-2')}Hapus item</button>` : '',
      body: `<div class="grid gap-4 sm:grid-cols-6">
        ${ui.field('Kode', `<input name="id" class="input font-mono" maxlength="12" value="${esc(i.id)}" ${baru ? 'required' : 'disabled'}>`, '', 'sm:col-span-2')}
        ${ui.field('Divisi', `<select name="divisionId" class="input" ${ro}>${ui.options(ctx.state.divisions.map((d) => [d.id, divLabel(d)]), i.divisionId)}</select>`, '', 'sm:col-span-4')}
        ${ui.field('Uraian BOQ', `<textarea name="uraian" rows="2" class="input" maxlength="300" ${ro}>${esc(i.uraian)}</textarea>`, '', 'sm:col-span-6')}
        ${ui.field('Subbagian', `<input name="subbagian" class="input" maxlength="80" value="${esc(i.subbagian)}" ${ro}>`, '', 'sm:col-span-4')}
        ${ui.field('Satuan', `<input name="satuan" class="input" maxlength="12" value="${esc(i.satuan)}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Volume BOQ', `<input name="volume" class="input text-right" inputmode="decimal" value="${num(i.volume)}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Harga nego (Rp)', `<input name="hargaNego" class="input text-right" inputmode="decimal" value="${num(i.hargaNego)}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Target vol Des', `<input name="targetVolDes" class="input text-right" inputmode="decimal" value="${num(i.targetVolDes)}" ${ro}>`, 'Kosongkan bila belum ada target', 'sm:col-span-2')}
        ${ui.field('PIC', `<input name="pic" class="input" maxlength="80" value="${esc(i.pic)}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Jadwal mulai', `<input name="mulai" type="date" class="input" value="${i.mulai || ''}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Jadwal selesai', `<input name="selesai" type="date" class="input" value="${i.selesai || ''}" ${ro}>`, '', 'sm:col-span-2')}
        ${ui.field('Kendala', `<textarea name="kendala" rows="2" class="input" maxlength="500" ${ro}>${esc(i.kendala)}</textarea>`, '', 'sm:col-span-3')}
        ${ui.field('Action plan / tindak lanjut', `<textarea name="actionPlan" rows="2" class="input" maxlength="500" ${ro}>${esc(i.actionPlan)}</textarea>`, '', 'sm:col-span-3')}
        ${ui.field('Due date action', `<input name="dueDate" type="date" class="input" value="${i.dueDate || ''}" ${ro}>`, '', 'sm:col-span-2')}
      </div>
      ${baru ? '' : `<h3 class="label mt-5">Riwayat input harian (${riwayat.length})</h3>
      ${riwayat.length ? `<div class="max-h-48 overflow-auto rounded-lg ring-1 ring-slate-200"><table class="tbl"><thead><tr><th>Tanggal</th><th class="num">Volume</th><th class="num">Nilai (Rp)</th><th>Diinput oleh</th></tr></thead>
        <tbody>${riwayat.map((p) => `<tr><td>${fmt.tgl(p.tanggal, true)}</td><td class="num">${fmt.vol(p.volume)} ${esc(i.satuan)}</td><td class="num">${fmt.rp0(p.volume * i.hargaNego)}</td><td>${esc(JIAT.sync.nama(p.diinputOleh))}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="text-sm text-slate-500">Belum ada realisasi untuk item ini.</p>'}`}`,
      onMount(el, close) {
        const del = el.querySelector('[data-hapus]');
        if (del) del.addEventListener('click', async () => {
          const ok = await ui.confirm({ title: `Hapus item ${i.id}?`, danger: true, confirmLabel: 'Hapus',
            message: `Item beserta <b>${riwayat.length} entri realisasi harian</b> akan dihapus dan bobot seluruh BOQ dihitung ulang. Tindakan ini tidak bisa dibatalkan.` });
          if (ok) { close(); local.draft.delete(i.id); store.deleteItem(i.id); ui.toast(`Item ${i.id} dihapus`); }
        });
      },
    });
    function submit(v) {
      const kode = baru ? v.id.trim().toUpperCase() : i.id;
      if (baru && !/^[A-Z0-9][A-Z0-9._-]{1,11}$/.test(kode)) return 'Kode wajib diisi (2–12 karakter: huruf, angka, titik, strip).';
      if (baru && ctx.state.items.some((x) => x.id === kode)) return `Kode ${kode} sudah dipakai.`;
      if (!v.uraian.trim()) return 'Uraian BOQ wajib diisi.';
      if (!v.satuan.trim()) return 'Satuan wajib diisi.';
      const volume = fmt.parseNum(v.volume), harga = fmt.parseNum(v.hargaNego), target = fmt.parseNum(v.targetVolDes);
      if (!(volume > 0)) return 'Volume BOQ harus angka lebih dari 0.';
      if (!(harga >= 0) || harga == null) return 'Harga nego harus angka 0 atau lebih.';
      if (Number.isNaN(target) || target < 0) return 'Target vol Des harus angka 0 atau lebih (atau dikosongkan).';
      if (target != null && target > volume + calc.EPS) return 'Target vol Des tidak boleh melebihi volume BOQ.';
      if (v.mulai && v.selesai && v.selesai < v.mulai) return 'Jadwal selesai tidak boleh sebelum jadwal mulai.';
      store.upsertItem({ id: kode, divisionId: v.divisionId, subbagian: v.subbagian.trim(), uraian: v.uraian.trim(), satuan: v.satuan.trim(), volume, hargaNego: harga, targetVolDes: target,
        pic: v.pic.trim(), mulai: v.mulai || null, selesai: v.selesai || null, kendala: v.kendala.trim(), actionPlan: v.actionPlan.trim(), dueDate: v.dueDate || null });
      ui.toast(baru ? `Item ${kode} ditambahkan` : `Item ${kode} disimpan`);
    }
  }

  // ------------------------------------------------------------------ mount
  function refreshTable() {
    const host = root.querySelector('#tbl-host');
    host.innerHTML = tableHTML();
    const clear = host.querySelector('#btn-clear');
    if (clear) clear.addEventListener('click', () => { Object.assign(local, { q: '', divisionId: '', status: '', hanyaTerisi: false }); ctx.setUI({}); });
    refreshSaveBar();
  }
  const adaDraft = () => local.mode === 'input' && perubahan().length > 0;
  async function bolehBuang() {
    if (!adaDraft()) return true;
    const ok = await ui.confirm({ title: 'Buang perubahan yang belum disimpan?', confirmLabel: 'Buang perubahan',
      message: `Ada ${perubahan().length} input harian untuk ${fmt.tgl(local.tanggal)} yang belum disimpan.` });
    if (ok) local.draft.clear();
    return ok;
  }

  function mount(el, c) {
    ctx = c; root = el;
    refreshTable();
    const on = (sel, ev, fn) => { const n = el.querySelector(sel); if (n) n.addEventListener(ev, fn); };
    el.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', async () => {
      if (b.dataset.mode === local.mode || !(await bolehBuang())) return;
      local.mode = b.dataset.mode; ctx.setUI({});
    }));
    on('#f-q', 'input', (e) => { local.q = e.target.value; refreshTable(); });
    on('#f-div', 'change', (e) => { local.divisionId = e.target.value; refreshTable(); });
    on('#f-status', 'change', (e) => { local.status = e.target.value; refreshTable(); });
    on('#f-terisi', 'change', (e) => { local.hanyaTerisi = e.target.checked; refreshTable(); });
    on('#f-tanggal', 'change', async (e) => {
      const t = e.target.value;
      if (!t || t === local.tanggal) return;
      if (!(await bolehBuang())) { e.target.value = local.tanggal; return; }
      local.tanggal = t; ctx.setUI({});
    });
    on('#btn-tambah', 'click', () => itemModal(null));

    const host = el.querySelector('#tbl-host');
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-item]'); if (b) itemModal(b.dataset.item); });
    host.addEventListener('input', (e) => {
      const inp = e.target.closest('[data-input]');
      if (!inp) return;
      const id = inp.dataset.input, item = ctx.view.items.find((i) => i.id === id), saved = tersimpan();
      local.draft.set(id, inp.value);
      const b = hitungBaris(item, saved);
      if (!b.invalid && !b.berubah) local.draft.delete(id);       // kembali ke nilai tersimpan
      const tr = inp.closest('tr');
      tr.querySelectorAll('[data-c]').forEach((n) => n.remove());
      tr.insertAdjacentHTML('beforeend', computedCells(item, b));
      inp.classList.toggle('border-red-600', b.invalid || b.melebihiBoq);
      inp.setAttribute('aria-invalid', String(b.invalid || b.melebihiBoq));
      refreshSaveBar();
    });
    // Enter / panah bawah-atas berpindah antar baris seperti di Excel.
    host.addEventListener('keydown', (e) => {
      if (!e.target.matches('[data-input]') || !['Enter', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
      e.preventDefault();
      const all = [...host.querySelectorAll('[data-input]')], next = all[all.indexOf(e.target) + (e.key === 'ArrowUp' ? -1 : 1)];
      if (next) { next.focus(); next.select(); }
    });
  }

  window.addEventListener('beforeunload', (e) => { if (ctx && root && root.isConnected && adaDraft()) { e.preventDefault(); e.returnValue = ''; } });

  JIAT.registerModule({ id: 'input', label: 'Input Harian & Rincian BOQ', icon: 'clipboard-list', order: 20, render, mount, beforeLeave: bolehBuang });
})();
</script>
  <script>/** Modul C — Monitoring Harian: target vs realisasi per tanggal + notulen rapat. */
(function () {
  'use strict';
  const { fmt, ui, store } = JIAT;
  const { esc } = fmt;
  const STATUS = ['', 'OPEN', 'ON PROGRESS', 'CLOSED', 'ESKALASI'];
  const local = { rentang: 'sd' };
  const dash = '<span class="text-slate-400">–</span>';

  function render(ctx) {
    const mon = ctx.ui.tanggalMonitoring;
    const rows = ctx.view.daily.filter((r) =>
      local.rentang === 'semua' || (local.rentang === 'catatan' ? r.note : r.tanggal <= mon));
    const dev = (v) => `<span class="${Math.abs(v) < 5e-7 ? 'text-slate-600' : v > 0 ? 'text-emerald-700' : 'text-red-700'}">${fmt.pct(v, 3, true)}</span>`;
    return `
    <div class="card">
      <div class="flex flex-wrap items-end justify-between gap-3 border-b border-slate-200 px-4 py-3">
        <div><h2 class="font-semibold text-slate-900">Monitoring harian · target vs realisasi (berbobot nilai nego)</h2>
          <p class="text-xs text-slate-500">Target kumulatif linier menuju ${fmt.pct(ctx.state.project.targetDes)} (simulasi; ubah di menu Data › Pengaturan). Kolom kendala s.d. catatan = bahan notulen rapat.</p></div>
        <label class="no-print block"><span class="label">Tampilkan</span><select id="f-rentang" class="input w-56">${ui.options([['sd', 'S.d. tanggal monitoring'], ['semua', 'Seluruh baseline'], ['catatan', 'Hanya yang ada catatan']], local.rentang)}</select></label>
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Tanggal</th><th class="num">Target Hari</th><th class="num">Target Kum</th><th class="num">Real Hari</th><th class="num">Real Kum</th><th class="num">Deviasi</th><th class="num">Nilai Progres Hari (Rp)</th>
          <th>Kendala Harian</th><th>Action / PIC</th><th>Due Date</th><th>Status</th><th>Catatan Rapat</th><th class="no-print"></th></tr></thead>
        <tbody>${rows.map((r) => {
          const n = r.note || {}, future = r.tanggal > mon, now = r.tanggal === mon;
          return `<tr class="${now ? 'bg-blue-50/60' : ''}">
            <td class="whitespace-nowrap ${now ? 'font-semibold text-blue-900' : ''}">${fmt.tgl(r.tanggal, true)}${now ? '<div class="text-xs font-normal">tgl monitoring</div>' : ''}</td>
            <td class="num">${fmt.pct(r.targetHari, 3)}</td><td class="num">${fmt.pct(r.targetKum, 3)}</td>
            <td class="num">${future ? dash : fmt.pct(r.realHari, 3)}</td><td class="num">${future ? dash : fmt.pct(r.realKum, 3)}</td>
            <td class="num">${future ? dash : dev(r.deviasi)}</td><td class="num">${future ? dash : fmt.rp0(r.nilaiHari)}</td>
            <td class="min-w-44 whitespace-pre-line">${esc(n.kendala) || dash}</td><td class="min-w-44 whitespace-pre-line">${esc(n.action) || dash}</td>
            <td class="whitespace-nowrap">${n.dueDate ? fmt.tgl(n.dueDate) : dash}</td><td>${ui.statusBadge(n.status)}</td>
            <td class="min-w-44 whitespace-pre-line">${esc(n.catatan) || dash}</td>
            <td class="no-print"><button type="button" class="btn-icon" data-note="${r.tanggal}" aria-label="Isi catatan rapat ${fmt.tgl(r.tanggal)}">${ui.icon('pencil')}</button></td></tr>`;
        }).join('')}</tbody></table></div>`
      : `<div class="px-4 py-12 text-center text-sm text-slate-500">${local.rentang === 'catatan' ? 'Belum ada catatan rapat harian.' : 'Tanggal monitoring berada sebelum mulai baseline (' + fmt.tgl(ctx.state.project.baselineMulai) + ').'}</div>`}
    </div>`;
  }

  function editNote(ctx, tanggal) {
    const r = ctx.view.daily.find((x) => x.tanggal === tanggal), n = r.note || {};
    ui.modal({
      title: 'Catatan rapat · ' + fmt.tgl(tanggal, true),
      subtitle: `Target kum ${fmt.pct(r.targetKum, 3)} · realisasi kum ${fmt.pct(r.realKum, 3)} · deviasi ${fmt.pct(r.deviasi, 3, true)}`,
      body: `<div class="grid gap-4 sm:grid-cols-2">
        ${ui.field('Kendala harian', `<textarea name="kendala" rows="3" class="input" maxlength="1000">${esc(n.kendala)}</textarea>`, '', 'sm:col-span-2')}
        ${ui.field('Action / PIC', `<textarea name="action" rows="2" class="input" maxlength="1000">${esc(n.action)}</textarea>`, '', 'sm:col-span-2')}
        ${ui.field('Due date', `<input name="dueDate" type="date" class="input" value="${n.dueDate || ''}">`)}
        ${ui.field('Status', `<select name="status" class="input">${ui.options(STATUS.map((s) => [s, s || '— belum diisi —']), n.status || '')}</select>`)}
        ${ui.field('Catatan rapat', `<textarea name="catatan" rows="3" class="input" maxlength="2000">${esc(n.catatan)}</textarea>`, 'Kosongkan semua kolom untuk menghapus catatan tanggal ini.', 'sm:col-span-2')}</div>`,
      onSubmit(v) {
        store.upsertDailyNote(tanggal, { kendala: v.kendala.trim(), action: v.action.trim(), dueDate: v.dueDate || null, status: v.status, catatan: v.catatan.trim() });
        ui.toast('Catatan rapat disimpan');
      },
    });
  }

  JIAT.registerModule({
    id: 'monitoring', label: 'Monitoring Harian & Notulen', icon: 'calendar-days', order: 30, render,
    mount(el, ctx) {
      el.querySelector('#f-rentang').addEventListener('change', (e) => { local.rentang = e.target.value; ctx.setUI({}); });
      el.querySelectorAll('[data-note]').forEach((b) => b.addEventListener('click', () => editNote(ctx, b.dataset.note)));
    },
  });
})();
</script>
  <script>/** Modul D — Pengadaan Penting (material kritis) & Lokasi Sumur (SBD / tim / vendor). */
(function () {
  'use strict';
  const { fmt, ui, store } = JIAT;
  const { esc } = fmt;
  const STATUS_SUMUR = ['BELUM MULAI', 'PROSES', 'SELESAI'];
  const local = { sub: 'pengadaan', tim: '', kab: '' };
  const dash = '<span class="text-slate-400">–</span>';
  const num = (v) => (v == null ? '' : String(v).replace('.', ','));

  /** Status stok terhadap kebutuhan target Des. */
  function statusStok(p, item) {
    if (p.stock2026 == null || !item || item.targetVolDes == null) return null;
    return p.stock2026 + 1e-7 >= item.targetVolDes ? 'AMAN' : 'KURANG';
  }

  function pengadaanHTML(ctx) {
    const items = new Map(ctx.view.items.map((i) => [i.id, i]));
    let last = null, body = '', no = 0;
    for (const p of ctx.state.procurement) {
      if (p.kelompok !== last) { last = p.kelompok; no = 0; body += `<tr class="group-row"><td colspan="${ctx.isAdmin ? 11 : 10}">${esc(p.kelompok)}</td></tr>`; }
      const i = items.get(p.itemId), st = statusStok(p, i);
      const kurang = st === 'KURANG' ? i.targetVolDes - p.stock2026 : 0;
      body += `<tr><td class="num">${++no}</td>
        <td class="min-w-56">${esc(p.uraian)}<div class="font-mono text-xs text-slate-500">${esc(p.itemId || 'tanpa tautan BOQ')}</div></td>
        <td>${i ? esc(i.satuan) : dash}</td><td class="num">${i ? fmt.vol(i.volume) : dash}</td>
        <td class="num">${p.stock2026 == null ? dash : fmt.vol(p.stock2026)}</td>
        <td class="num">${i && i.targetVolDes != null ? fmt.vol(i.targetVolDes) : dash}</td>
        <td class="num">${p.mos == null ? dash : fmt.vol(p.mos)}</td>
        <td class="num">${i ? fmt.vol(i.realisasi) : dash}</td>
        <td>${st ? ui.statusBadge(st) + (kurang ? `<div class="mt-1 text-xs text-orange-800">kurang ${fmt.vol(kurang)} ${esc(i.satuan)}</div>` : '') : ui.badge('Stock belum diisi', 'muted')}</td>
        <td class="min-w-40 whitespace-pre-line">${esc(p.catatan) || dash}</td>
        ${ctx.isAdmin ? `<td class="no-print"><button type="button" class="btn-icon" data-pgd="${p.id}" aria-label="Ubah stok ${esc(p.uraian)}">${ui.icon('pencil')}</button></td>` : ''}</tr>`;
    }
    return `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>No</th><th>Uraian</th><th>Sat</th><th class="num">Total (BOQ)</th><th class="num">Stock 2026</th><th class="num">Kebutuhan<br>Target Des</th><th class="num">MOS</th><th class="num">Terpasang<br>s.d. tgl</th><th>Stock vs Target</th><th>Catatan</th>${ctx.isAdmin ? '<th class="no-print"></th>' : ''}</tr></thead>
      <tbody>${body}</tbody></table></div>
      <p class="border-t border-slate-200 px-4 py-2 text-xs text-slate-500">Total, target Des, dan terpasang otomatis mengikuti item BOQ tertaut. Stock 2026 awal = 50% total BOQ (sesuai Excel); kelompok C belum diisi di Excel. MOS = material on site.${ctx.isAdmin ? '' : ' Perubahan stok dilakukan oleh Admin.'}</p>`;
  }

  function sumurHTML(ctx) {
    const wells = ctx.state.wells.filter((w) => (!local.tim || w.tim === local.tim) && (!local.kab || w.kabupaten === local.kab));
    const uniq = (k) => [...new Set(ctx.state.wells.map((w) => w[k]))].sort();
    const count = (list, k) => Object.entries(list.reduce((m, w) => ((m[w[k]] = (m[w[k]] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]);
    const chips = (title, pairs) => `<div><span class="label">${title}</span><div class="flex flex-wrap gap-1.5">${pairs.map(([k, v]) => `<span class="rounded-md bg-slate-100 px-2 py-1 text-xs text-slate-700">${esc(k)} <b class="tabular-nums text-slate-900">${v}</b></span>`).join('')}</div></div>`;
    return `
      <div class="flex flex-wrap items-end gap-4 border-b border-slate-200 px-4 py-3">
        <label class="no-print block"><span class="label">Tim</span><select id="f-tim" class="input w-36">${ui.options([['', 'Semua tim'], ...uniq('tim')], local.tim)}</select></label>
        <label class="no-print block"><span class="label">Kabupaten</span><select id="f-kab" class="input w-48">${ui.options([['', 'Semua kabupaten'], ...uniq('kabupaten')], local.kab)}</select></label>
        ${chips('Sumur per vendor pemboran', count(wells, 'vendorPemboran'))}
        ${chips('Status', count(wells, 'status'))}
      </div>
      ${wells.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>No</th><th>SBD</th><th>Kabupaten</th><th>Dominasi Tanah</th><th>Rekomtek</th><th>Tim</th><th>Vendor Pemboran</th><th>Status</th><th>Catatan</th><th class="no-print"></th></tr></thead>
        <tbody>${wells.map((w, i) => `<tr><td class="num">${i + 1}</td><td class="font-medium whitespace-nowrap">${esc(w.sbd)}</td><td>${esc(w.kabupaten)}</td><td>${esc(w.tanah)}</td><td>${esc(w.rekomtek)}</td>
          <td class="whitespace-nowrap">${esc(w.tim)}</td><td>${esc(w.vendorPemboran)}</td><td>${ui.statusBadge(w.status)}</td><td class="min-w-40 whitespace-pre-line">${esc(w.catatan) || dash}</td>
          <td class="no-print"><button type="button" class="btn-icon" data-well="${esc(w.id)}" aria-label="Ubah ${esc(w.sbd)}">${ui.icon('pencil')}</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="px-4 py-12 text-center text-sm text-slate-500">Tidak ada sumur pada kombinasi tim dan kabupaten ini.</div>'}`;
  }

  function render(ctx) {
    const seg = (id, label, ic) => `<button type="button" data-sub="${id}" aria-pressed="${local.sub === id}">${ui.icon(ic)}${label}</button>`;
    return `<div class="card">
      <div class="no-print border-b border-slate-200 px-4 py-3"><div class="seg">${seg('pengadaan', `Pengadaan Penting (${ctx.state.procurement.length})`, 'package')}${seg('sumur', `Lokasi Sumur (${ctx.state.wells.length})`, 'map-pin')}</div></div>
      ${local.sub === 'pengadaan' ? pengadaanHTML(ctx) : sumurHTML(ctx)}</div>`;
  }

  function editPengadaan(ctx, id) {
    const p = ctx.state.procurement.find((x) => x.id === id), i = ctx.view.items.find((x) => x.id === p.itemId);
    ui.modal({
      title: 'Stok material · ' + p.uraian, size: 'max-w-lg',
      subtitle: i ? `Total BOQ ${fmt.vol(i.volume)} ${i.satuan} · target Des ${i.targetVolDes == null ? '–' : fmt.vol(i.targetVolDes)} · terpasang ${fmt.vol(i.realisasi)}` : '',
      body: `<div class="grid gap-4 sm:grid-cols-2">
        ${ui.field('Stock 2026', `<input name="stock2026" class="input text-right" inputmode="decimal" value="${num(p.stock2026)}">`, 'Rencana/ketersediaan stok tahun 2026')}
        ${ui.field('MOS (material on site)', `<input name="mos" class="input text-right" inputmode="decimal" value="${num(p.mos)}">`, 'Sudah tiba di lapangan')}
        ${ui.field('Catatan', `<textarea name="catatan" rows="3" class="input" maxlength="500">${esc(p.catatan)}</textarea>`, 'Mis. nomor PO, jadwal kirim, vendor', 'sm:col-span-2')}</div>`,
      onSubmit(v) {
        const stock = fmt.parseNum(v.stock2026), mos = fmt.parseNum(v.mos);
        if (Number.isNaN(stock) || stock < 0 || Number.isNaN(mos) || mos < 0) return 'Stock dan MOS harus angka 0 atau lebih (atau dikosongkan).';
        store.updateProcurement(id, { stock2026: stock, mos, catatan: v.catatan.trim() });
        ui.toast('Data pengadaan disimpan');
      },
    });
  }

  function editSumur(ctx, id) {
    const w = ctx.state.wells.find((x) => x.id === id);
    const ro = ctx.isAdmin ? '' : 'disabled';
    ui.modal({
      title: `${w.sbd} · ${w.kabupaten}`, subtitle: `Dominasi tanah: ${w.tanah}`, size: 'max-w-lg',
      body: `<div class="grid gap-4 sm:grid-cols-2">
        ${ui.field('Tim', `<input name="tim" class="input" maxlength="30" value="${esc(w.tim)}" ${ro}>`)}
        ${ui.field('Vendor pemboran', `<input name="vendorPemboran" class="input" maxlength="60" value="${esc(w.vendorPemboran)}" ${ro}>`, ctx.isAdmin ? '' : 'Hanya Admin yang dapat mengganti tim/vendor')}
        ${ui.field('Status pemboran', `<select name="status" class="input">${ui.options(STATUS_SUMUR, w.status)}</select>`)}
        ${ui.field('Rekomtek', `<input name="rekomtek" class="input" maxlength="60" value="${esc(w.rekomtek)}" ${ro}>`)}
        ${ui.field('Catatan lapangan', `<textarea name="catatan" rows="3" class="input" maxlength="500">${esc(w.catatan)}</textarea>`, '', 'sm:col-span-2')}</div>`,
      onSubmit(v) {
        const data = { status: v.status, catatan: v.catatan.trim() };
        if (ctx.isAdmin) {
          if (!v.tim.trim() || !v.vendorPemboran.trim()) return 'Tim dan vendor pemboran wajib diisi.';
          Object.assign(data, { tim: v.tim.trim(), vendorPemboran: v.vendorPemboran.trim(), rekomtek: v.rekomtek.trim() });
        }
        store.updateWell(id, data);
        ui.toast(`${w.sbd} disimpan`);
      },
    });
  }

  JIAT.registerModule({
    id: 'pengadaan', label: 'Pengadaan & Lokasi Sumur', icon: 'package', order: 40, render,
    mount(el, ctx) {
      el.querySelectorAll('[data-sub]').forEach((b) => b.addEventListener('click', () => { local.sub = b.dataset.sub; ctx.setUI({}); }));
      el.querySelectorAll('[data-pgd]').forEach((b) => b.addEventListener('click', () => editPengadaan(ctx, b.dataset.pgd)));
      el.querySelectorAll('[data-well]').forEach((b) => b.addEventListener('click', () => editSumur(ctx, b.dataset.well)));
      const on = (sel, key) => { const n = el.querySelector(sel); if (n) n.addEventListener('change', (e) => { local[key] = e.target.value; ctx.setUI({}); }); };
      on('#f-tim', 'tim'); on('#f-kab', 'kab');
    },
  });
})();
</script>
  <script>JIAT.start();</script>
</body>
