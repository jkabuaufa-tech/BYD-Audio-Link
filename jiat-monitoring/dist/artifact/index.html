  <script>/** format.js — Format angka/tanggal gaya Indonesia + util kecil. */
(function () {
  'use strict';
  const JIAT = (window.JIAT = window.JIAT || {});
  const nf = (min, max) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: min, maximumFractionDigits: max });
  const NF = { rp: nf(2, 2), rp0: nf(0, 0), vol: nf(0, 2) };
  const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  JIAT.fmt = {
    /** Rupiah lengkap dua desimal: Rp 80.323.036.615,49 */
    rp: (n) => 'Rp ' + NF.rp.format(n || 0),
    rp0: (n) => NF.rp0.format(n || 0),
    /** Volume: maks. 2 desimal, tanpa nol di belakang. */
    vol: (n) => (n == null || n === '' ? '–' : NF.vol.format(n)),
    /** Pecahan → persen. `signed` menambah tanda +/− untuk deviasi. */
    pct(n, digits = 2, signed = false) {
      if (n == null || Number.isNaN(n)) return '–';
      const v = nf(digits, digits).format(Math.abs(n) * 100) + '%';
      if (!signed) return (n < 0 ? '−' : '') + v;
      return (n > 0 ? '+' : n < 0 ? '−' : '') + v;
    },
    tgl(iso, withDay = false) {
      if (!iso) return '–';
      const [y, m, d] = iso.split('-').map(Number);
      const day = withDay ? HARI[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] + ', ' : '';
      return `${day}${d} ${BULAN[m - 1]} ${y}`;
    },
    tglPendek(iso) { const [, m, d] = iso.split('-').map(Number); return `${d} ${BULAN[m - 1]}`; },
    /** Tanggal hari ini menurut zona waktu perangkat. */
    today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    },
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]),
    /** "1.234,5" atau "1234.5" → number; kosong → null; tidak valid → NaN. */
    parseNum(s) {
      const t = String(s == null ? '' : s).trim();
      if (!t) return null;
      const norm = t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t;
      return /^-?\d*\.?\d+$/.test(norm) ? Number(norm) : NaN;
    },
  };
})();

  <script>/**
 * calc.js — Mesin kalkulasi (murni, tanpa DOM, tanpa penyimpanan).
 *
 * Seluruh rumus meniru sheet Excel "Rekap Action Plan" & "Rincian Harian".
 * Karena murni, berkas ini bisa dipakai apa adanya di backend Node.js saat
 * data dipindah ke PostgreSQL/MySQL (lihat tests/calc.test.js).
 *
 * Konvensi: tanggal = string ISO "YYYY-MM-DD"; persen = pecahan (0.3005 = 30,05%).
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.JIAT = root.JIAT || {}).calc = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const EPS = 1e-7;
  const STATUS = Object.freeze({
    OVER: 'CEK > BOQ', DONE: 'SELESAI', LATE: 'TERLAMBAT', RUNNING: 'BERJALAN', IDLE: 'BELUM MULAI',
  });

  const toUTC = (iso) => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const fromUTC = (t) => new Date(t).toISOString().slice(0, 10);
  const addDays = (iso, n) => fromUTC(toUTC(iso) + n * 864e5);
  const diffDays = (a, b) => Math.round((toUTC(a) - toUTC(b)) / 864e5);
  /** Daftar tanggal inklusif dari `start` s.d. `end`. */
  function dateRange(start, end) {
    const out = [];
    for (let d = start; d <= end; d = addDays(d, 1)) out.push(d);
    return out;
  }

  /** Target kumulatif linier (Rekap!B35): 0 → targetDes sepanjang baseline. */
  function targetKumulatif(project, tanggal) {
    const span = diffDays(project.baselineAkhir, project.baselineMulai) + 1;
    const elapsed = diffDays(tanggal, project.baselineMulai) + 1;
    return Math.max(0, Math.min(project.targetDes, (elapsed / span) * project.targetDes));
  }

  /** Status item (Rincian!V10). `realisasi` = kumulatif s.d. tanggal monitoring. */
  function statusItem(item, realisasi, tanggalMonitoring) {
    if (realisasi > item.volume + EPS) return STATUS.OVER;
    if (item.volume > 0 && realisasi >= item.volume) return STATUS.DONE;
    if (item.selesai && item.selesai < tanggalMonitoring) return STATUS.LATE;
    return realisasi > 0 ? STATUS.RUNNING : STATUS.IDLE;
  }

  /**
   * Hitung seluruh tampilan turunan dari state mentah.
   * @param {object} state  data tersimpan (lihat README: Struktur Data)
   * @param {string} tanggalMonitoring  posisi progres yang disimulasikan
   */
  function compute(state, tanggalMonitoring) {
    const { project } = state;
    const totalNilai = state.items.reduce((s, it) => s + it.volume * it.hargaNego, 0);

    // Indeks progres: itemId -> { s.d. tanggal, seluruh tanggal }, dan tanggal -> nilai Rp.
    const realSd = new Map(), realAll = new Map(), nilaiPerTanggal = new Map();
    const harga = new Map(state.items.map((it) => [it.id, it.hargaNego]));
    for (const p of state.progress) {
      if (!harga.has(p.itemId)) continue;
      realAll.set(p.itemId, (realAll.get(p.itemId) || 0) + p.volume);
      if (p.tanggal <= tanggalMonitoring) realSd.set(p.itemId, (realSd.get(p.itemId) || 0) + p.volume);
      nilaiPerTanggal.set(p.tanggal, (nilaiPerTanggal.get(p.tanggal) || 0) + p.volume * harga.get(p.itemId));
    }

    const items = state.items.map((it) => {
      const nilai = it.volume * it.hargaNego;
      const bobot = totalNilai ? nilai / totalNilai : 0;
      const realisasi = realSd.get(it.id) || 0;
      const progres = it.volume ? realisasi / it.volume : 0;
      return {
        ...it, nilai, bobot,
        targetBobotDes: it.targetVolDes == null || !it.volume ? null : (it.targetVolDes / it.volume) * bobot,
        realisasi, realisasiTotal: realAll.get(it.id) || 0,
        sisa: Math.max(0, it.volume - realisasi),
        progres, kontribusi: bobot * progres,
        status: statusItem(it, realisasi, tanggalMonitoring),
      };
    });

    const divisions = state.divisions.map((d) => {
      const rows = items.filter((it) => it.divisionId === d.id);
      const sum = (f) => rows.reduce((s, r) => s + (f(r) || 0), 0);
      const targetDes = sum((r) => r.targetBobotDes), realisasi = sum((r) => r.kontribusi);
      return {
        ...d, jumlahItem: rows.length, nilai: sum((r) => r.nilai), bobot: sum((r) => r.bobot), targetDes, realisasi,
        deviasi: targetDes === 0 ? null : realisasi - targetDes,
        itemTerlambat: rows.filter((r) => r.status === STATUS.LATE).length,
      };
    });

    // Tabel monitoring harian (Rekap!A35:L86).
    const notes = new Map(state.dailyNotes.map((n) => [n.tanggal, n]));
    let kum = 0, targetPrev = 0;
    const daily = dateRange(project.baselineMulai, project.baselineAkhir).map((tanggal) => {
      const nilaiHari = nilaiPerTanggal.get(tanggal) || 0;
      const realHari = totalNilai ? nilaiHari / totalNilai : 0;
      const targetKum = targetKumulatif(project, tanggal);
      const row = {
        tanggal, targetKum, targetHari: targetKum - targetPrev, realHari, realKum: (kum += realHari),
        nilaiHari, note: notes.get(tanggal) || null,
      };
      row.deviasi = row.realKum - targetKum;
      targetPrev = targetKum;
      return row;
    });

    const sdTanggal = daily.filter((r) => r.tanggal <= tanggalMonitoring);
    const realisasiSd = sdTanggal.reduce((s, r) => s + r.realHari, 0);
    const targetLinier = sdTanggal.reduce((s, r) => s + r.targetHari, 0);
    const targetDetailDes = items.reduce((s, r) => s + (r.targetBobotDes || 0), 0);
    const summary = {
      tanggalMonitoring, totalNilai, targetDes: project.targetDes,
      realisasiHariIni: (daily.find((r) => r.tanggal === tanggalMonitoring) || {}).realHari || 0,
      realisasiSd, nilaiRealisasiSd: realisasiSd * totalNilai, targetLinier,
      deviasi: realisasiSd - targetLinier,
      sisaKeTarget: Math.max(0, project.targetDes - realisasiSd),
      itemTerisiTarget: items.filter((r) => r.targetVolDes != null).length,
      itemTerlambat: items.filter((r) => r.status === STATUS.LATE).length,
      itemCekBoq: items.filter((r) => r.realisasiTotal > r.volume + EPS).length,
      jumlahItem: items.length, targetDetailDes, selisihTargetDetail: targetDetailDes - project.targetDes,
    };
    return { summary, items, divisions, daily };
  }

  /** Validasi satu input harian. `kumulatifLain` = total item di tanggal lain. */
  function cekInputHarian(item, kumulatifLain, volumeHari) {
    const total = kumulatifLain + volumeHari;
    return {
      total, sisa: Math.max(0, item.volume - total),
      melebihiBoq: total > item.volume + EPS,
      kelebihan: Math.max(0, total - item.volume),
    };
  }

  return { EPS, STATUS, compute, cekInputHarian, statusItem, targetKumulatif, dateRange, addDays, diffDays };
});

 * MODEL: state = DATA AWAL (seed dari Excel) + OVERLAY (perubahan pengguna).
 * Overlay adalah kumpulan dokumen kecil per koleksi; inilah yang disimpan dan

 *     divisions:   { "DIV-03": {pic, kendala, tindakLanjut, dueDate, statusAction} },
 *     items:       { "N055": {…seluruh field item…} | {dihapus: true} },
 *     progress:    { "2026-11-13~<pengguna>": {tanggal, oleh, entries: {"N055": {v, t, n}}} },
 *     dailyNotes:  { "2026-11-13": {kendala, action, dueDate, status, catatan} },
 *     procurement: { "PGD-01": {stock2026, mos, catatan} },
 *     wells:       { "SBD-31": {tim, vendorPemboran, status, catatan, rekomtek} },

    items: ['divisionId', 'subbagian', 'uraian', 'satuan', 'volume', 'hargaNego', 'targetVolDes', 'pic', 'mulai', 'selesai', 'kendala', 'actionPlan', 'dueDate'],

    return target[id];
  }

    const proj = pick(s.project, F.project);
    if (!same(proj, pick(seed.project, F.project))) o.meta.project = proj;
    for (const [col, keys] of [['divisions', F.divisions], ['procurement', F.procurement], ['wells', F.wells]]) {
      const base = byId(seed[col]);
      for (const r of s[col]) if (isObj(r) && base.has(r.id) && !same(pick(r, keys), pick(base.get(r.id), keys))) o[col][r.id] = pick(r, keys);
    }

    SCHEMA_VERSION, COLS,

    get: () => state,
    isPersistent: () => storageOk || !!remote,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    // --- sinkronisasi (dipakai sync.js) ----------------------------------------
    /** Pasang adaptor basis data bersama dan identitas pengguna. */

    /** Ganti isi satu koleksi overlay dengan data terbaru dari remote. */
    applyRemote(col, docs) {

    },

    saveProgress(entries, nama) {

      apply(Object.entries(docs).map(([id, doc]) => ({ col: 'progress', id, doc })));
    },
    /**
     * Gabungkan input harian dari berkas JSON kiriman staf (mode tanpa sinkron).
     * Entri baru ditambahkan; volume berbeda → yang `updatedAt`-nya lebih baru.

      const hasil = { baru: 0, diperbarui: 0, sama: 0, dilewati: 0, catatan: 0 }, docs = {}, changes = [];
      for (const p of data.progress) {
        if (!isObj(p) || !itemIds.has(p.itemId) || !isDate(p.tanggal) || typeof p.volume !== 'number' || !(p.volume > 0)) { hasil.dilewati++; continue; }
        const lama = cur.get(p.itemId + ':' + p.tanggal), t = text(p.updatedAt, 40);

      }
      Object.entries(docs).forEach(([id, doc]) => changes.push({ col: 'progress', id, doc }));
      const ada = new Set(state.dailyNotes.map((n) => n.tanggal));   // catatan rapat: hanya mengisi tanggal kosong
      for (const n of data.dailyNotes) {
        if (!isObj(n) || !isDate(n.tanggal) || ada.has(n.tanggal)) continue;

    // --- master & koleksi lain -------------------------------------------------
    upsertItem(data) { apply([{ col: 'items', id: data.id, doc: pick(data, F.items) }]); },
    deleteItem(id) { apply([{ col: 'items', id, doc: { dihapus: true } }]); },
    updateDivision(id, data) { apply([{ col: 'divisions', id, doc: { ...overlay.divisions[id], ...pick(data, F.divisions) } }]); },
    upsertDailyNote(tanggal, data) { apply([{ col: 'dailyNotes', id: tanggal, doc: pick(data, F.dailyNotes) }]); },
    updateProcurement(id, data) { apply([{ col: 'procurement', id, doc: { ...overlay.procurement[id], ...pick(data, F.procurement) } }]); },
    updateWell(id, data) { apply([{ col: 'wells', id, doc: { ...overlay.wells[id], ...pick(data, F.wells) } }]); },
    updateProject(data) { apply([{ col: 'meta', id: 'project', doc: { ...overlay.meta.project, ...pick(data, F.project) } }]); },

    // --- cadangan / pemulihan ---------------------------------------------------
    exportJSON: () => JSON.stringify({ aplikasi: 'jiat-monitoring', diekspor: now(), ...state }, null, 2),
    /** Ganti SELURUH data dengan isi berkas cadangan. */

      const lama = overlay;
      overlay = emptyOverlay();                       // agar diffToOverlay tidak menyalin dokumen progres lama
      const baru = diffToOverlay(data);
      overlay = lama;
      const changes = [];
      for (const col of COLS) {
        for (const id of Object.keys(overlay[col])) if (!(id in baru[col])) changes.push({ col, id, doc: null });
        for (const [id, doc] of Object.entries(baru[col])) if (!same(overlay[col][id], doc)) changes.push({ col, id, doc });
      }
      apply(changes);
    },
    reset() { apply(COLS.flatMap((col) => Object.keys(overlay[col]).map((id) => ({ col, id, doc: null })))); },
  };
})();

  <script>/**
 * sync.js — Sinkronisasi otomatis antar pengguna.
 *
 * Aktif bila halaman dibuka sebagai artifact di claude.ai (tersedia
 * `window.claude`): data overlay disimpan di basis data bersama milik artifact
 * dan setiap perubahan orang lain langsung muncul tanpa muat ulang.
 * Bila tidak tersedia (berkas dibuka langsung dari komputer), aplikasi tetap
 * berjalan dalam mode lokal seperti biasa.
 *
 * Hak akses mengikuti menu Share claude.ai:
 *   Editor/Owner  → Admin  (master BOQ, action plan, stok, pengaturan)
 *   Contributor   → Staf   (input harian, catatan rapat, status sumur)
 *   Viewer        → hanya melihat
 * Aturan ini ditegakkan server lewat deklarasi `db.rules` saat publish.
 */
(function () {
  'use strict';
  const JIAT = (window.JIAT = window.JIAT || {});
  const { store } = JIAT;

  const S = (JIAT.sync = {
    /** 'lokal' | 'menghubungkan' | 'tersinkron' | 'menyimpan' | 'tertunda' | 'gagal' */
    status: 'lokal',
    cloud: false, isAdmin: false, canWrite: null, me: null, pending: 0,
    names: {}, downloads: null, onChange: () => {},

    /** Nama tampilan untuk kolom "diinput oleh". */
    nama(v) {
      if (!S.cloud || v === 'Excel') return v || '–';
      if (S.names[v]) return S.names[v];
      return S.me && v === S.me.id ? 'Anda' : /^u_/.test(v || '') ? 'Staf' : v || 'Staf';
    },

    async start(onChange) {
      S.onChange = onChange;
      const use = (name) => { try { return Promise.resolve(window.claude.use(name)).catch(() => null); } catch (_) { return Promise.resolve(null); } };
      if (!window.claude || typeof window.claude.use !== 'function') return;
      setStatus('menghubungkan');
      const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
      S.downloads = downloads;
      if (!db) return setStatus('lokal');
      if (user) {
        S.me = await user.me();
        S.isAdmin = await user.canEdit();
        S.canWrite = await user.can('data.write');
      }
      S.cloud = true;
      store.attachRemote({ write: (changes) => enqueue(db, changes) }, S.me && S.me.id ? S.me.id : 'tamu');

      // Batas waktu memuat: bila 10 detik belum ada jawaban pasti, beri tahu pengguna.
      const live = new Set();
      const timer = setTimeout(() => { if (live.size < store.COLS.length && S.status === 'menghubungkan') setStatus('tertunda'); }, 10000);
      for (const col of store.COLS) {
        db.collection(col).onSnapshot((snap) => {
          const docs = {};
          snap.docs.forEach((d) => { docs[d.id] = JSON.parse(JSON.stringify(d.data())); });   // salin: snapshot dibekukan
          store.applyRemote(col, docs);
          if (!snap.metadata.fromCache) live.add(col);
          if (live.size === store.COLS.length) { clearTimeout(timer); if (!S.pending && S.status !== 'gagal') setStatus('tersinkron'); }
          if (col === 'progress' && user) resolveNames(user, docs);
        }, (err) => { clearTimeout(timer); console.error('Sinkronisasi berhenti', err); setStatus('gagal'); });
      }
    },

    /** Simpan berkas: lewat kapabilitas `downloads` di artifact, atau tautan unduh biasa. */
    async save(filename, data, mime) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
      if (S.downloads) {
        try { await S.downloads.save({ filename, data: blob }); return true; }
        catch (e) { if (e && e.code !== 'declined') JIAT.ui.toast('Berkas tidak dapat disimpan dari tampilan ini', 'bad'); return false; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return true;
    },
  });

  function setStatus(s) { if (S.status !== s) { S.status = s; S.onChange(); } }

  // Antrean tulis: satu per satu, agar tidak ada dua tulisan bersamaan ke dokumen yang sama.
  let chain = Promise.resolve();
  let ditolak = false;
  function enqueue(db, changes) {
    S.pending += changes.length;
    setStatus('menyimpan');
    for (const c of changes) {
      chain = chain.then(async () => {
        const ref = db.collection(c.col).doc(c.id);
        const run = () => (c.doc == null ? ref.delete() : ref.set(c.doc));
        try {
          try { await run(); }
          catch (e) { if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 800)); await run(); } else throw e; }
        } catch (e) {
          console.error('Gagal menyimpan', c.col, c.id, e);
          if (!ditolak) {
            ditolak = true; setTimeout(() => { ditolak = false; }, 5000);      // satu pesan per rentetan
            const code = e && e.code;
            JIAT.ui.toast(code === 'invalid_argument' ? 'Perubahan ditolak: akses Anda tidak mengizinkan mengubah data ini'
              : code === 'quota_exceeded' ? 'Basis data penuh — hubungi Admin' : 'Perubahan belum tersimpan ke server; periksa koneksi lalu ulangi', 'bad');
          }
        } finally {
          S.pending--;
          if (!S.pending && S.status === 'menyimpan') setStatus('tersinkron');
        }
      });
    }
  }

  let lastIds = '';
  async function resolveNames(user, docs) {
    const ids = [...new Set(Object.values(docs).map((d) => d && d.oleh).filter((v) => typeof v === 'string' && v))].sort();
    if (!ids.length || ids.join() === lastIds) return;
    lastIds = ids.join();
    const ps = await user.profiles(ids);
    let changed = false;
    for (const id of ids) { const n = ps[id] && ps[id].name; if (n && S.names[id] !== n) { S.names[id] = n; changed = true; } }
    if (changed) S.onChange();
  }
})();

      const done = (v) => { document.removeEventListener('keydown', onKey, true); el.remove(); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
      document.addEventListener('keydown', onKey, true);
      el.querySelector('[data-no]').addEventListener('click', () => done(false));
      el.querySelector('[data-yes]').addEventListener('click', () => done(true));
      modalRoot.appendChild(el);
      el.querySelector('[data-no]').focus();
    });
  }

  function toast(message, tone = 'good') {
    roots();
    const el = document.createElement('div');
    const style = { good: ['bg-emerald-700', 'circle-check'], bad: ['bg-red-700', 'octagon-alert'], warn: ['bg-amber-700', 'triangle-alert'] }[tone];
    el.className = `flex items-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium text-white shadow-lg ${style[0]}`;
    el.setAttribute('role', 'status');
    el.innerHTML = icon(style[1]) + esc(message);
    toastRoot.appendChild(el);
    while (toastRoot.children.length > 3) toastRoot.firstElementChild.remove();
    setTimeout(() => el.remove(), tone === 'good' ? 3000 : 6000);
  }

  /** Bar tipis 0–100% (mis. progres item). */
  const meter = (frac, tone = 'bg-blue-600') =>
    `<span class="mt-1 block h-1 w-full overflow-hidden rounded-full bg-slate-200"><span class="block h-full rounded-full ${tone}" style="width:${Math.max(0, Math.min(1, frac || 0)) * 100}%"></span></span>`;

  JIAT.ui = { icon, badge, statusBadge, field, options, modal, confirm, toast, meter };
})();
</script>

  <script>/**
 * app.js — Kerangka aplikasi: registri modul, header, navigasi tab, aksi global.
 *
 * MENAMBAH MODUL/TAB BARU: buat js/modules/<nama>.js yang memanggil
 *   JIAT.registerModule({ id, label, icon, order, render(ctx), mount(el, ctx), beforeLeave?() })
 * lalu tambahkan <script> di index.html. Tidak ada berkas lain yang perlu diubah.
 *
 * ctx = { state, view, ui{tab,role,tanggalMonitoring}, isAdmin, setUI(), navigate(), store }
 */
(function () {
  'use strict';
  const JIAT = (window.JIAT = window.JIAT || {});
  const { fmt, ui, store, calc, sync } = JIAT;
  const { esc } = fmt;
  const UI_KEY = 'jiat-monitoring:ui';

  const modules = [];
  JIAT.registerModule = (def) => { modules.push(def); modules.sort((a, b) => a.order - b.order); };

  const uiState = { tab: null, role: 'staff', nama: '', tanggalMonitoring: fmt.today() };
  let navParams = null;

  function saveUI() {
    try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: uiState.tab, role: uiState.role, nama: uiState.nama })); } catch (_) { /* abaikan */ }
  }
  function buildCtx() {
    const state = store.get();
    return {
      state, store, ui: uiState, params: navParams, sync,
      /** Mode sinkron: peran mengikuti hak akses Share; mode lokal: tombol peran. */
      isAdmin: sync.cloud ? sync.isAdmin : uiState.role === 'admin',
      /** Nama untuk jejak audit input (kolom "diinput oleh"). */
      pengguna: sync.cloud ? '' : uiState.nama.trim() || (uiState.role === 'admin' ? 'Admin' : 'Staf'),
      view: calc.compute(state, uiState.tanggalMonitoring),
      setUI(patch) { Object.assign(uiState, patch); saveUI(); render(); },
      navigate,
    };
  }
  async function navigate(tab, params = null) {
    const current = modules.find((m) => m.id === uiState.tab);
    if (tab !== uiState.tab && current && current.beforeLeave && !(await current.beforeLeave())) return;
    navParams = params;
    uiState.tab = tab;
    saveUI();
    render();
    navParams = null;
  }

  // ---------------------------------------------------------------- tampilan
  function headerHTML(ctx) {
    const s = ctx.view.summary;
    const roleBtn = (id, label, ic) =>
      `<button type="button" data-role="${id}" aria-pressed="${uiState.role === id}">${ui.icon(ic)}${label}</button>`;
    return `
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 sm:px-6">
        <div class="flex min-w-0 items-center gap-3">
          <span class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-blue-700 text-white">${ui.icon('droplets', 'size-6')}</span>
          <div class="min-w-0">
            <h1 class="text-sm font-bold tracking-wide text-slate-900 sm:text-base">${esc(ctx.state.project.nama)}</h1>
            <p class="text-xs text-slate-500">Jaringan Irigasi Air Tanah · Nilai Nego BOQ <span class="font-semibold text-slate-700">${fmt.rp(s.totalNilai)}</span></p>
          </div>
        </div>
        <div class="no-print flex flex-wrap items-end gap-3">
          <label class="block"><span class="label">Tanggal monitoring</span>
            <span class="flex gap-1"><input id="tgl-monitoring" type="date" class="input w-40" value="${uiState.tanggalMonitoring}">
            <button type="button" id="tgl-hari-ini" class="btn" title="Kembali ke tanggal hari ini">Hari ini</button></span></label>
          ${sync.cloud ? `<div><span class="label">Masuk sebagai</span>
            <div class="flex h-[34px] items-center gap-2 text-sm font-medium text-slate-800"><span id="nama-cloud"></span>${ui.badge(ctx.isAdmin ? 'Admin' : sync.canWrite === false ? 'Hanya lihat' : 'Staf', ctx.isAdmin ? 'info' : 'muted', ctx.isAdmin ? 'shield-check' : 'user')}</div></div>`
          : `<label class="block"><span class="label">Nama Anda</span>
            <input id="nama-pengguna" class="input w-36" maxlength="40" placeholder="mis. Andi" value="${esc(uiState.nama)}" title="Dicatat pada setiap input harian"></label>
          <div><span class="label">Peran</span>
            <div class="seg" role="group" aria-label="Peran pengguna">${roleBtn('staff', 'Staf', 'user')}${roleBtn('admin', 'Admin', 'shield-check')}</div></div>`}
          <div><span class="label">Data</span><div class="flex h-[34px] items-center">${statusHTML()}</div></div>
          <details class="relative" id="menu-data">
            <summary class="btn list-none">${ui.icon('ellipsis-vertical')}Data</summary>
            <div class="absolute right-0 z-30 mt-1 w-60 rounded-lg bg-white p-1 text-sm shadow-xl ring-1 ring-slate-200">
              ${menuItem('export-xlsx', 'file-spreadsheet', 'Ekspor ke Excel')}
              ${sync.cloud ? '' : menuItem('print', 'printer', 'Cetak halaman ini')}
              ${menuItem('backup', 'download', sync.cloud ? 'Unduh cadangan (JSON)' : 'Unduh data / kirim ke Admin (JSON)')}
              ${ctx.isAdmin ? menuItem('merge', 'list-checks', 'Gabungkan input harian dari berkas staf') + menuItem('restore', 'upload', 'Pulihkan dari cadangan') + menuItem('settings', 'settings', 'Pengaturan target & baseline')
                + '<hr class="my-1 border-slate-200">' + menuItem('reset', 'rotate-ccw', 'Reset ke data awal Excel', 'text-red-700') : ''}
            </div>
          </details>
          <input type="file" id="file-restore" accept="application/json,.json" class="hidden">
          <input type="file" id="file-merge" accept="application/json,.json" multiple class="hidden">
        </div>
      </div>
      <nav class="no-print mx-auto flex max-w-[1600px] gap-1 overflow-x-auto px-4 sm:px-6" aria-label="Modul">
        ${modules.map((m) => `
          <button type="button" data-tab="${m.id}" aria-current="${m.id === uiState.tab ? 'page' : 'false'}"
            class="inline-flex cursor-pointer items-center gap-2 whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium ${m.id === uiState.tab
              ? 'border-blue-700 text-blue-800' : 'border-transparent text-slate-600 hover:border-slate-300 hover:text-slate-900'}">
            ${ui.icon(m.icon)}${esc(m.label)}</button>`).join('')}
      </nav>
    </header>`;
  }
  function statusHTML() {
    const map = {
      lokal: ['Lokal (perangkat ini)', 'muted', 'save'], menghubungkan: ['Menghubungkan…', 'muted', 'loader'],
      tersinkron: ['Tersinkron', 'good', 'circle-check'], menyimpan: [`Menyimpan… (${sync.pending})`, 'info', 'loader'],
      tertunda: ['Belum terhubung', 'warn', 'triangle-alert'], gagal: ['Sinkron terputus', 'bad', 'octagon-alert'],
    };
    const [label, tone, ic] = map[sync.status];
    return `<span title="${sync.cloud ? 'Perubahan tersimpan ke basis data bersama dan langsung terlihat oleh pengguna lain' : 'Data hanya tersimpan di browser ini'}">${ui.badge(label, tone, ic)}</span>`;
  }
  const menuItem = (action, ic, label, cls = 'text-slate-700') =>
    `<button type="button" data-action="${action}" class="flex w-full cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-left hover:bg-slate-100 ${cls}">${ui.icon(ic)}${label}</button>`;

  function render() {
    const ctx = buildCtx();
    const mod = modules.find((m) => m.id === uiState.tab) || modules[0];
    uiState.tab = mod.id;
    const app = document.getElementById('app');
    const scrollY = window.scrollY;
    // Render ulang bisa dipicu perubahan pengguna lain: jaga fokus & posisi kursor.
    const act = document.activeElement, inApp = act && app.contains(act);
    const focusSel = !inApp ? null : act.dataset.input ? `[data-input="${CSS.escape(act.dataset.input)}"]` : act.id ? '#' + CSS.escape(act.id) : null;
    let caret = null;
    try { caret = focusSel && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null; } catch (_) { /* input tanpa seleksi */ }
    app.innerHTML = headerHTML(ctx) +
      (store.isPersistent() ? '' : `<div role="alert" class="bg-red-700 px-4 py-2 text-center text-sm font-medium text-white">Penyimpanan browser penuh atau diblokir — perubahan TIDAK tersimpan. Unduh cadangan JSON sekarang.</div>`) +
      `<main id="module-root" class="mx-auto max-w-[1600px] px-4 py-5 sm:px-6">${mod.render(ctx)}</main>`;
    bindHeader(ctx);
    if (mod.mount) mod.mount(document.getElementById('module-root'), ctx);
    if (sync.status === 'tertunda' || sync.status === 'gagal') app.querySelector('main').insertAdjacentHTML('beforebegin',
      `<div role="alert" class="bg-amber-100 px-4 py-2 text-center text-sm font-medium text-amber-900">${sync.status === 'gagal'
        ? 'Sinkronisasi terputus. Perubahan Anda mungkin tidak terkirim — muat ulang halaman setelah koneksi pulih.'
        : 'Server data belum terjangkau. Yang tampil adalah salinan terakhir di perangkat ini dan mungkin belum mutakhir.'}</div>`);
    const nm = document.getElementById('nama-cloud');
    if (nm) nm.textContent = (sync.me && sync.me.name) || 'Anda';     // nama orang = input pihak lain → textContent
    if (focusSel) {
      const el = app.querySelector(focusSel);
      if (el) { el.focus({ preventScroll: true }); if (caret) try { el.setSelectionRange(caret[0], caret[1]); } catch (_) { /* abaikan */ } }
    }

  }

  function bindHeader(ctx) {
    const $ = (sel) => document.querySelector(sel);
    $('#tgl-monitoring').addEventListener('change', (e) => { if (e.target.value) ctx.setUI({ tanggalMonitoring: e.target.value }); });
    $('#tgl-hari-ini').addEventListener('click', () => ctx.setUI({ tanggalMonitoring: fmt.today() }));
    document.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => ctx.setUI({ role: b.dataset.role })));
    document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => navigate(b.dataset.tab)));
    document.querySelectorAll('#menu-data [data-action]').forEach((b) => b.addEventListener('click', () => {
      $('#menu-data').removeAttribute('open');
      actions[b.dataset.action](ctx);
    }));
    if ($('#nama-pengguna')) $('#nama-pengguna').addEventListener('change', (e) => { uiState.nama = e.target.value.trim(); saveUI(); });
    $('#file-merge').addEventListener('change', async (e) => {
      const total = { baru: 0, diperbarui: 0, sama: 0, dilewati: 0, catatan: 0 }, gagal = [];
      for (const file of e.target.files) {
        try { const h = store.mergeProgress(await file.text()); for (const k in total) total[k] += h[k]; }
        catch (err) { gagal.push(file.name + ': ' + err.message); }
      }
      if (gagal.length) ui.toast('Gagal dibaca — ' + gagal.join('; '), 'bad');
      else ui.toast(`Digabung: ${total.baru} entri baru, ${total.diperbarui} diperbarui, ${total.sama} sudah sama, ${total.dilewati} dilewati, ${total.catatan} catatan rapat`, total.dilewati ? 'warn' : 'good');
    });
    $('#file-restore').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try { store.importJSON(await file.text()); ui.toast('Data dipulihkan dari ' + file.name); }
      catch (err) { ui.toast('Gagal memulihkan: ' + err.message, 'bad'); }
    });
  }

  // ------------------------------------------------------------ aksi global
  const stamp = () => fmt.today().replace(/-/g, '');
  const actions = {
    'export-xlsx': (ctx) => JIAT.exportExcel(ctx),
    print: () => window.print(),
    async backup() { if (await sync.save(`jiat-monitoring-${(sync.cloud ? 'cadangan' : uiState.nama.trim() || uiState.role).replace(/[^\w-]+/g, '_')}-${stamp()}.json`, store.exportJSON(), 'application/json')) ui.toast('Cadangan diunduh'); },
    async merge() {
      const ok = await ui.confirm({ title: 'Gabungkan input harian dari staf?', confirmLabel: 'Pilih berkas',
        message: 'Pilih satu atau beberapa berkas JSON kiriman staf. Hanya <b>volume harian</b> dan <b>catatan rapat</b> yang digabung; master BOQ dan action plan Anda tidak berubah. Bila item dan tanggal yang sama punya volume berbeda, yang dipakai adalah input paling baru.' });
      if (ok) document.getElementById('file-merge').click();
    },
    async restore() {
      const ok = await ui.confirm({ title: 'Pulihkan dari cadangan?', danger: true, confirmLabel: 'Pilih berkas',
        message: sync.cloud ? 'Seluruh data bersama akan <b>diganti untuk semua pengguna</b> dengan isi berkas cadangan.' : 'Seluruh data di browser ini akan <b>diganti</b> dengan isi berkas cadangan.' });
      if (ok) document.getElementById('file-restore').click();
    },
    async reset() {
      const ok = await ui.confirm({ title: 'Reset ke data awal?', danger: true, confirmLabel: 'Ya, reset',
        message: (sync.cloud ? '<b>Berlaku untuk semua pengguna.</b> ' : '') + 'Semua input harian, catatan rapat, dan perubahan master akan <b>dihapus</b> dan kembali ke isi Excel awal. Unduh cadangan dulu bila perlu.' });
      if (ok) { store.reset(); ui.toast('Data dikembalikan ke kondisi awal'); }
    },
    settings(ctx) {
      const p = ctx.state.project;
      ui.modal({
        title: 'Pengaturan target & baseline', subtitle: 'Dipakai untuk kurva target linier (simulasi) dan deviasi.', size: 'max-w-lg',
        body: `<div class="grid gap-4 sm:grid-cols-3">
          ${ui.field('Target Des 2026 (%)', `<input name="targetDes" class="input" inputmode="decimal" value="${String(+(p.targetDes * 100).toFixed(4)).replace('.', ',')}">`)}
          ${ui.field('Mulai baseline', `<input name="baselineMulai" type="date" class="input" value="${p.baselineMulai}">`)}
          ${ui.field('Akhir baseline', `<input name="baselineAkhir" type="date" class="input" value="${p.baselineAkhir}">`)}</div>`,
        onSubmit(v) {
          const t = fmt.parseNum(v.targetDes);
          if (t == null || Number.isNaN(t) || t <= 0 || t > 100) return 'Target harus angka antara 0 dan 100.';
          if (!v.baselineMulai || !v.baselineAkhir || v.baselineAkhir <= v.baselineMulai) return 'Akhir baseline harus setelah tanggal mulai.';
          if (calc.diffDays(v.baselineAkhir, v.baselineMulai) > 1100) return 'Rentang baseline maksimal 3 tahun.';
          store.updateProject({ targetDes: t / 100, baselineMulai: v.baselineMulai, baselineAkhir: v.baselineAkhir });
          ui.toast('Pengaturan disimpan');
        },
      });
    },
  };

  JIAT.start = function () {
    store.init();
    try { Object.assign(uiState, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch (_) { /* abaikan */ }
    if (uiState.role !== 'admin') uiState.role = 'staff';
    uiState.nama = String(uiState.nama || '').slice(0, 40);
    store.subscribe(render);
    document.addEventListener('click', (e) => {   // tutup menu Data saat klik di luar
      const menu = document.getElementById('menu-data');
      if (menu && menu.open && !menu.contains(e.target)) menu.removeAttribute('open');
    });
    render();
    sync.start(render);
  };
})();

  <script>/** Modul A — Dashboard & Rekap Action Plan (ringkasan eksekutif). */
(function () {

  const { fmt, ui, store, calc } = JIAT;
  const { esc } = fmt;
  const STATUS_ACTION = ['OPEN', 'ON PROGRESS', 'CLOSED', 'ESKALASI'];
  let resizeTimer = null;

  const tile = (label, value, sub = '', ic = '', accent = '') => `
    <div class="card p-4">
      <div class="flex items-center justify-between gap-2 text-xs font-semibold uppercase tracking-wide text-slate-500"><span>${label}</span>${ic ? `<span class="text-slate-400">${ui.icon(ic)}</span>` : ''}</div>
