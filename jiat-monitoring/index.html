<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Action Plan & Progres Harian – JIAT Lampung</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><p class="p-8 text-sm text-slate-500">Memuat aplikasi…</p></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="no-print fixed right-4 bottom-4 z-50 flex flex-col items-end gap-2" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Aplikasi ini membutuhkan JavaScript.</p></noscript>

  <!-- Pustaka pihak ketiga (lokal, tanpa CDN) -->
  <script src="vendor/xlsx.full.min.js"></script>
  <!-- Data awal + inti -->
  <script src="js/data/seed.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/calc.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/pembaruan.js"></script>
  <script src="js/core/sync.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/export.js"></script>
  <script src="js/core/gerbang.js"></script>
  <script src="js/core/app.js"></script>
  <!-- Modul (tab). Tambah modul baru = tambah satu baris di sini. -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/input-harian.js"></script>
  <script src="js/modules/monitoring-harian.js"></script>
  <script src="js/modules/pengadaan-sumur.js"></script>
  <script src="js/modules/pengguna.js"></script>
  <script>
    // Salinan utuh berkas ini (hanya bila berkas tunggal) → bahan "HTML untuk staf".
    if (!document.querySelector('script[src]')) JIAT.SUMBER_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    JIAT.auth.init();
    JIAT.pembaruan.init();
    if (JIAT.auth.enabled) { JIAT.gerbang.muatBawaan(); JIAT.pembaruan.terapkan(); }
    JIAT.start();
    JIAT.pembaruan.selesaiBuka();
  </script>
</body>
</html>
